
name: Publicar Papelaria Literária

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spike-props/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: ./spike-props

      - name: Construir projeto
        run: npm run build
        working-directory: ./spike-props

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './spike-props/dist'

      - name: Publicar site
        uses: actions/deploy-pages@v4
